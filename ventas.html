<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameStore - Ventas del Usuario</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
	<header class="d-flex justify-content-between align-items-center p-3">
    <button id="btn-salir" class="btn btn-primary btn-small">Cerrar sesión</button>	
	</header>

    <div id="Ventas" class="container form-container">
        <h2> Historial de Compras </h2>
		<form class="">
			<table class="table table-striped table-hover table-bordered">
				<thead>
					<tr>
						<th>#</th>
						<th>Usuario</th>
						<th>Fecha</th>
						<th>Productos</th>
						<th>Total Base</th>
						<th>IVA</th>
						<th>Total Final</th>
					</tr>
				</thead>
				<tbody id="tbody-ventas"></tbody>
			</table>
		</form>
        <button class="btn btn-primary mt-3" onclick="window.location.href='admin.html'" id="botonVolver">Volver al panel</button>
    </div>
    
    
    <script type ="module" src="js/commonFunctions.js"></script>
    <script type="module" src="js/page/ventas_realizadas.js"></script>
    <script type="module" src="js/actualizarPagina.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
