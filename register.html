<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>GS Register</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	
</head>
<body>
	<a class="btn btn-small" href="index.html">← Regresar</a>
	<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
		<div id="registro" class="card p-4 shadow">
			<h2>Registro</h2>
			<form id="form-registro">
				<div class="mb-3">
					<label for="username" class="form-label">Usuario: </label>
					<input class="form-control" type="text" minlength="2" maxlength="30" id="username" placeholder="Nombre" required>
				</div>
				<div class="mb-3">
					<label for="email" class="form-label">Correo: </label>
					<input class="form-control" type="email" id="email" placeholder="nombre@correo.com" required>
				</div>
				<div class="mb-3">
					<label for="password" class="form-label">Contraseña: </label>
					<input class="form-control" type="password" minlength="4" maxlength="32" id="password" placeholder="Contraseña" required>
				</div>
				
				<button type="submit" class="btn btn-primary">Registrarse</button>
				<button class="btn btn-secondary" onclick="window.location.href='login.html'">Ya tengo una cuenta</button>
			</form>
		</div>
	</div>
		
		
		<script type="module" src="js/commonFunctions.js"></script>
		<script src="js/register.js" defer></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>	
</body>
</html>
