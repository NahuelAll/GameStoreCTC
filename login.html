<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="css/style.css">
	<title> GS login </title>
</head>
<body>
<a class="btn btn-small" href="index.html">← Regresar</a>
	<div>
		<div id="login" class="container form-container">
			<h2> Login </h2>
			<form id="form-login">
			<div class="form-group">
				<label for="email">Correo: </label>
				<input type="email" id="email" placeholder="ejemplo1234@gmail.com" required>
			</div>
			<div class="form-group">
				<label for="password">Contraseña: </label>
				<input type="password" minlength="4" maxlength="32" id="password" required>
			</div>
				<button type="submit" class="btn btn-primary">LOGIN</button>
			</form>
				<button class="btn btn-secundary" onclick="window.location.href='register.html'">No tengo cuenta</button>
		</div>
	</div>
	<script src="js/commonFunctions.js"></script>
	<script src="js/login.js"></script>
</body>
</html>
