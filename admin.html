<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title> GS Panel Admin </title>
	<link rel="stylesheet" href="css/style.css">
	<!-- bootstrap -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
	<button id="btn-salir" class="btn btn-primary btn-small">Cerrar sesión</button>	
	<div id="CrearObjetos" class="container form-container mt-4">
		<h2>Craea el producto</h2>
		<input type="hidden" id="idEditando" value="" />
		<input type="hidden" id="imagenActual" value="" />
		<form id="form-producto">
			<div class="mb-3">
				<label for="categoria" class="form-label"> Categoria</label>
				<select id="categoria" class="form-select">
					<option value =""> Seleccione la Categoria</option>
					<option value ="accion"> Accion</option>
					<option value ="aventura"> Aventura</option>
					<option value ="mundo-abierto"> Mundo Abierto</option>
					<option value ="rpg"> RPG</option>
					<option value ="shooter"> Shooter</option>
					<option value ="terror"> Terror</option>
					<option value ="deportes"> Deportes</option>
					<option value ="carreras"> Carreras</option>
					<option value ="estrategia"> Estrategia</option>
					<option value ="supervivencia"> Supervivencia</option>
					<option value ="combate"> Combate</option>
					<option value ="sandbox"> SANDBOX</option>
					<option value ="moba"> MOBA</option>
					<option value ="roguelike"> Roguelike</option>
					<option value ="arcade"> Arcade</option>
				</select>
			</div>
			<div class="mb-3">
				<label for="nombre" class="form-label"> Nombre del producto</label>
				<input type="text" class="form-control" id="nombre" required>
			</div>
				<div class="mb-3">
				<label for="descripcion" class="form-label"> descripcion del producto </label>
				<textarea  class="form-select" id="descripcion" placeholder="Describe el producto" required></textarea>
			</div>
			<div class="mb-3">
				<label for="precio" class="form-label"> Precio del producto </label>
				<input type="number" id="precio" class="form-control" min="0" placeholder="$$$ en dolares" required oninput="actualizarPrecioFinal()"><!--el precio se actualice sin necesidad de un boton para calcular el iva -->
			</div>
				<div class="mb-3">
				<label for="iva" class="form-label"> Seleccione el IVA </label>
				<select id="iva" class="form-select" onchange="actualizarPrecioFinal()" required>
					<option value="22">22% (Maximo)</option>
					<option value="10">10% (Minimo)</option>
					<option value="0">0% (Exento)</option>
				</select>
			</div>
				<div class="mb-3">
				<p id="precio-final" class="fw-bold"></p>
			</div>
			<div class="mb-3">
				<label for="stock" class="form-label"> Unidades disponibles: </label>
				<input type="number" id="stock" class="form-control" min="0" required>
			</div>
			<div class="mb-3">
				<label for="imagen" class="form-label"> Imagen del producto </label>
				<input id="imagen"class="form-control" type="file" accept="image/*" required onchange="previsualizarImagen(this)"> 
				<img id="preview-imagen" style="display:none;width:100px;" class="mt-2">
			</div>
			<div class:"d-flex gap-2">
				<button id="btn-crear" type="submit" class="btn btn-primary">Crear producto</button><br>
				<button id="btn-cancelar-creacion" type="submit" class="btn btn-primary" style="display:none;">Cancelar</button>
				<button class="btn btn-primary" onclick="window.location.href='index.html'" id="botonLogin">Tienda</button>
				<button class="btn btn-primary" onclick="window.location.href='ventas.html'" id="botonVentas">Ver ventas</button>
			</div>
			
		</form>
		<h2> Objetos creados </h2>
		<table border="1" class="table table-striped table-hover">
			<thead>
				<tr>
					<th>Categoria</th>
					<th>Imagen</th>
					<th>Nombre</th>
					<th>Precio Base</th>
					<th>IVA</th>
					<th>Precio Final</th>
					<th>Stock</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody id="tbody-productos"></tbody>
		</table>
	</div>

	<script type="module" src="js/commonFunctions.js"></script>
	<script type="module" src="js/admin.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
<html>
