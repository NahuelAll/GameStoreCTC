<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>GameStore</title>
	<link rel="stylesheet" href="css/style.css">
	<script src="https://kit.fontawesome.com/5e44c9a494.js"crossorigin="anonymous"></script>
</head>
<body>
	<header>
		<div class="container-user">
				<p id="usuarioActual"></p>
				<i class="fa-solid fa-user"></i>
		</div>
		<a class="btn btn-small" href="index.html">← Regresar</a>
		<button id="btn-salir" class="btn btn-small">Cerrar sesión</button>
	</header>
	<main>
	<h2> TU CARRITO </h2>
	<div id="contenedor-carrito"></div>
	<div id="resumen-carrito" style="display:none"> <!-- nota, oculto este div para mostrarlo desde el js con todos los datos --> 
		<hr>
		<p>Precio base total: <span id="total-base"></span></p> 
		<p>IVA total: <span id="total-iva"></span></p>
		<p><b>Total final<span id="total-final"></span></b></p> <!-- el <b> solo pone el texto en negrita -->
		<button id="btn-vaciar" class="btn">Vaciar Carrito</button>
		<button id="btn-confirmar" class="btn btn-primary"> Confirmar compra </button>
	</div>
	</main>
	<script type="module" src="js/commonFunctions.js"></script>
	<script type="module" src="js/page/carrito.js"></script>
</body>
</html>
