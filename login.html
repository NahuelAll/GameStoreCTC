<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<title> GS login </title>
</head>
<body>
<a class="navbar-brand fs-2" href="index.html">← Regresar</a>
	<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
		<div id="login" class="card p-4 shadow">
			<h2> Login </h2>
			<form id="form-login">
			<div class="mb-3">
				<label for="email" class="form-label">Correo: </label>
				<input type="email" class="form-control" id="email" placeholder="nombre@correo.com" required>
			</div>
			<div class="mb-3">
				<label for="password" class="form-label">Contraseña: </label>
				<input type="password" class="form-control" minlength="4" maxlength="32" id="password" placeholder="Contraseña" required>
			</div>
				<button type="submit" class="btn btn-primary">LOGIN</button>
			</form>
				<button class="btn btn-secondary mt-2" onclick="window.location.href='register.html'">No tengo cuenta</button>
		</div>
	</div>
	<script type="module" src="js/commonFunctions.js"></script>
	<script src="js/login.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
