<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title> GS Panel Admin </title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<button id="btn-salir" class="btn btn-small">Cerrar sesión</button>	
	<div id="CrearObjetos" class="container form-container">
		<h2>Craea el producto</h2>
		<input type="hidden" id="idEditando" value="" />
		<input type="hidden" id="imagenActual" value="" />
		<form id="form-producto">
			<div class="form-group">
				<label for="categoria"> Categoria</label>
				<select id="categoria">
					<option value =""> Seleccione la Categoria</option>
					<option value ="accion"> Accion</option>
					<option value ="aventura"> Aventura</option>
					<option value ="mundo-abierto"> Mundo Abierto</option>
					<option value ="rpg"> RPG</option>
					<option value ="shooter"> Shooter</option>
					<option value ="terror"> Terror</option>
					<option value ="deportes"> Deportes</option>
					<option value ="carreras"> Carreras</option>
					<option value ="estrategia"> Estrategia</option>
					<option value ="supervivencia"> Supervivencia</option>
					<option value ="combate"> Combate</option>
					<option value ="sandbox"> SANDBOX</option>
					<option value ="moba"> MOBA</option>
					<option value ="roguelike"> Roguelike</option>
					<option value ="arcade"> Arcade</option>
				</select>
			</div>
			<div class="form-group">
				<label for="nombre"> Nombre del producto</label>
				<input type="text" id="nombre" required>
			</div>
			<div class="form-group">
				<label for="descripcion"> descripcion del producto </label>
				<textarea id="descripcion" placeholder="Describe el producto" required></textarea>
			</div>
			<div class="form-group">
				<label for="precio"> Precio del producto </label>
				<input type="number" id="precio" min="0" placeholder="$$$ en dolares" required oninput="actualizarPrecioFinal()"><!--el precio se actualice sin necesidad de un boton para calcular el iva -->
			</div>
			<div class="form-group">
				<label for="iva"> Seleccione el IVA </label>
				<select id="iva" onchange="actualizarPrecioFinal()" required>
					<option value="22">22% (Maximo)</option>
					<option value="10">10% (Minimo)</option>
					<option value="0">0% (Exento)</option>
				</select>
			</div>
			<div class="form-group">
				<p id="precio-final"></p>
			</div>
			<div class="form-group">
				<label for="stock"> Unidades disponibles: </label>
				<input type="number" id="stock"  min="0" required>
			</div>
			<div class="form-group">
				<label for="imagen"> Imagen del producto </label>
				<input id="imagen" type="file" accept="image/*" required onchange="previsualizarImagen(this)"> 
				<img id="preview-imagen" style="display:none;width:100px;">
			</div>
			<button id="btn-crear" type="submit" class="btn btn-primary">Crear producto</button><br>
			<button id="btn-cancelar-creacion" type="submit" class="btn btn-primary" style="display:none;">Cancelar</button>
			<button class="btn btn-primary" onclick="window.location.href='index.html'" id="botonLogin">Tienda</button>
		</form>
		<h2> Objetos creados </h2>
		<table border="1" class="table">
			<thead>
				<tr>
					<th>Categoria</th>
					<th>Imagen</th>
					<th>Nombre</th>
					<th>Precio Base</th>
					<th>IVA</th>
					<th>Precio Final</th>
					<th>Stock</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody id="tbody-productos"></tbody>
		</table>
	</div>

	<script type="module" src="js/commonFunctions.js"></script>
	<script type="module" src="js/admin.js"></script>	
</body>
<html>
