<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>GS Register</title>
	<link rel="stylesheet" href="css/style.css">
	
</head>
<body>
	<a class="btn btn-small" href="index.html">← Regresar</a>
	<div>
		<div id="registro" class="container form-container">
			<h2>Registro</h2>
			<form id="form-registro">
				<div class="form-group">
					<label for="username">Usuario: </label>
					<input type="text" minlength="2" maxlength="30" id="username" required>
				</div>
				<div class="form-group">
					<label for="email">Correo: </label>
					<input type="email" id="email" placeholder="nombre@correo.com" required>
				</div>
				<div class="form-group">
					<label for="password">Contraseña: </label>
					<input type="password" minlength="4" maxlength="32" id="password" required>
				</div>
				
				<button type="submit" class="btn btn-primary">Registrarse</button>
				<button class="btn btn-secundary" onclick="window.location.href='login.html'">Ya tengo una cuenta</button>
			</form>
		</div>
	</div>
		
		
		<script type="module" src="js/commonFunctions.js"></script>
		<script src="js/register.js" defer></script>
	
</body>
</html>
